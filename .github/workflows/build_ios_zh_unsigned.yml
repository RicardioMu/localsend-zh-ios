name: Build Chinese iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # connectivity_plus 7.3.1 references iOS 26 Network.framework APIs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install pinned Flutter through FVM
        env:
          FVM_USE_GIT_CACHE: "false"
        run: |
          dart pub global activate fvm
          fvm install
          fvm flutter --version
          xcodebuild -version

      - name: Install pinned Rust with iOS target
        run: |
          RUST_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate Chinese sources and iOS resources
        run: |
          python3 support/scripts/validate_zh_localization.py
          plutil -lint app/ios/Runner.xcodeproj/project.pbxproj
          plutil -lint app/ios/Runner/en.lproj/InfoPlist.strings
          plutil -lint app/ios/Runner/zh-Hans.lproj/InfoPlist.strings

      - name: Resolve Flutter dependencies and generate translations
        working-directory: app
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm dart run slang

      - name: Analyze and test localization
        working-directory: app
        run: |
          fvm flutter analyze
          fvm flutter test test/unit/i18n_test.dart

      - name: Build unsigned iPhone app
        id: device-build
        working-directory: app
        run: |
          fvm flutter build ios --release --no-codesign --dart-define=LOCALSEND_DEFAULT_LOCALE=zh-CN

      - name: Verify and package unsigned IPA
        run: |
          python3 support/scripts/package_unsigned_ipa.py

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSend-zh-CN-unsigned-ipa
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve device build if packaging fails
        if: failure() && steps.device-build.outcome == 'success'
        run: tar -czf "$RUNNER_TEMP/localsend-device-app.tar.gz" -C app/build/ios/iphoneos Runner.app

      - uses: actions/upload-artifact@v4
        if: failure() && steps.device-build.outcome == 'success'
        with:
          name: LocalSend-unsigned-device-app-recovery
          path: ${{ runner.temp }}/localsend-device-app.tar.gz
          retention-days: 14
